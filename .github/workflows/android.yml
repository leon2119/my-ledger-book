name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Android SDK Environment
      uses: android-actions/setup-android@v3

    - name: Scaffold Application Framework
      run: |
        npm install -g cordova
        cordova create myApp com.leon2119.ledgerbook LedgerBook
        cd myApp
        cordova platform add android@12.0.0
        rm -rf www/*
        cp ../index.html www/index.html

    - name: Compile Application Package
      run: |
        cd myApp
        cordova build android --release --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: myApp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
