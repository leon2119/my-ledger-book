name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Move App Files to Web Folder
      run: |
        mkdir www
        mv index.html www/

    - name: Install Capacitor Core and CLI
      run: npm install @capacitor/core @capacitor/cli

    - name: Initialize Capacitor Config
      run: npx cap init LedgerBook com.leon2119.ledgerbook --web-dir=www

    - name: Add Android Platform
      run: |
        npm install @capacitor/android
        npx cap add android

    - name: Sync Web Code into Android Project
      run: npx cap sync android

    - name: Patch Gradle Security Configuration
      run: |
        cd android
        # Inject an entry to disable strict signature checks for buggy jars
        echo "org.gradle.dependency.verification=off" >> gradle.properties
        
        # Force the project build file to ignore signature exceptions
        sed -i '/dependencies {/a \        implementation(group: "org.bouncycastle", name: "bcprov-jdk18on", version: "1.79") { force = true }' app/build.gradle

    - name: Build Unsigned Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
