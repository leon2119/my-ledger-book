# Force Trigger Run Google Bubblewrap Builder
name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Android SDK Tools
      uses: android-actions/setup-android@v3

    - name: Create Web Manifest Configuration
      run: |
        cat << 'EOF' > manifest.json
        {
          "name": "LedgerBook",
          "short_name": "Ledger",
          "start_url": "index.html",
          "display": "standalone",
          "background_color": "#ffffff",
          "theme_color": "#2563eb",
          "orientation": "portrait"
        }
        EOF
        # Inject manifest reference into our index.html layout file template
        sed -i '/<head>/a \    <link rel="manifest" href="manifest.json">' index.html

    - name: Install Google Bubblewrap CLI Tool
      run: npm install -g @bubblewrap/cli

    - name: Initialize Web App Package Shell
      run: |
        # Generate automated build mapping options configurations
        bubblewrap init --manifest=manifest.json --meta-validate=false --signingKeyPath=none --no-prompt

    - name: Compile Lightweight Mobile Android APK
      run: |
        bubblewrap build --skipKeyGen --no-prompt

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: "*.apk"
